name: twind

on:
  push:
    paths: ["twind/**", ".github/workflows/twind.yml"]
  pull_request:
    paths: ["twind/**", ".github/workflows/twind.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twind/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/ruff check app tests && .venv/bin/ruff format --check app tests
      - run: .venv/bin/pytest -q
      - name: migrations round-trip
        run: |
          TWIND_DATABASE_URL=sqlite+aiosqlite:///./ci.db .venv/bin/alembic upgrade head
          TWIND_DATABASE_URL=sqlite+aiosqlite:///./ci.db .venv/bin/alembic downgrade base

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twind/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx tsc --noEmit
